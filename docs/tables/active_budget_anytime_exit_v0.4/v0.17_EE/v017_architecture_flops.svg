<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img"><title>v0.17 architecture-extension FLOPs</title><desc>Three-exit and five-exit v0.17 policies compared with their own full-depth references.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:24px;font-weight:700}.axis{stroke:#444;stroke-width:1.3}.grid{stroke:#ddd}.tick{font-size:14px}.note{font-size:13px;fill:#555}</style><text x="490.0" y="40" text-anchor="middle" class="title">v0.17 architecture extension: estimated FLOPs saved</text><line x1="100" y1="90" x2="100" y2="410" class="axis"/><line x1="100" y1="410" x2="930" y2="410" class="axis"/><line x1="100" y1="410.0" x2="930" y2="410.0" class="grid"/><text x="90" y="415.0" text-anchor="end" class="tick">0%</text><line x1="100" y1="364.3" x2="930" y2="364.3" class="grid"/><text x="90" y="369.3" text-anchor="end" class="tick">5%</text><line x1="100" y1="318.6" x2="930" y2="318.6" class="grid"/><text x="90" y="323.6" text-anchor="end" class="tick">10%</text><line x1="100" y1="272.9" x2="930" y2="272.9" class="grid"/><text x="90" y="277.9" text-anchor="end" class="tick">15%</text><line x1="100" y1="227.1" x2="930" y2="227.1" class="grid"/><text x="90" y="232.1" text-anchor="end" class="tick">20%</text><line x1="100" y1="181.4" x2="930" y2="181.4" class="grid"/><text x="90" y="186.4" text-anchor="end" class="tick">25%</text><line x1="100" y1="135.7" x2="930" y2="135.7" class="grid"/><text x="90" y="140.7" text-anchor="end" class="tick">30%</text><line x1="100" y1="90.0" x2="930" y2="90.0" class="grid"/><text x="90" y="95.0" text-anchor="end" class="tick">35%</text><polyline points="100.0,410.0 376.7,331.0 653.3,410.0 930.0,129.2" fill="none" stroke="#1f77b4" stroke-width="3"/><circle cx="100.0" cy="410.0" r="5" fill="#1f77b4"/><text x="100.0" y="398.0" text-anchor="middle" class="tick">0.00%</text><text x="100.0" y="438" transform="rotate(25 100.0 438)" text-anchor="start" class="tick">Always E3</text><circle cx="376.7" cy="331.0" r="5" fill="#1f77b4"/><text x="376.7" y="319.0" text-anchor="middle" class="tick">8.64%</text><text x="376.7" y="438" transform="rotate(25 376.7 438)" text-anchor="start" class="tick">v0.17 3-exit</text><circle cx="653.3" cy="410.0" r="5" fill="#1f77b4"/><text x="653.3" y="398.0" text-anchor="middle" class="tick">0.00%</text><text x="653.3" y="438" transform="rotate(25 653.3 438)" text-anchor="start" class="tick">Always E5</text><circle cx="930.0" cy="129.2" r="5" fill="#1f77b4"/><text x="930.0" y="117.2" text-anchor="middle" class="tick">30.71%</text><text x="930.0" y="438" transform="rotate(25 930.0 438)" text-anchor="start" class="tick">v0.17 5-exit</text><text x="100" y="536" class="note">Each policy is compared with its own full-depth baseline. Direct 3-exit versus 5-exit superiority is not established because manifests differ.</text></svg>