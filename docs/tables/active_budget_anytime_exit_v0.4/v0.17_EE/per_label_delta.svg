<style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:24px;font-weight:700}.label{font-size:15px}.axis{stroke:#333;stroke-width:1}.gain{fill:#59a14f}.loss{fill:#e15759}.zero{stroke:#666;stroke-dasharray:4 4}</style>
